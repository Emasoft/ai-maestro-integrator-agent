[project]
name = "ai-maestro-integrator-agent"
version = "1.6.0"
description = "AI Maestro Integrator Agent - Code review, CI/CD integration, GitHub operations, and quality assurance"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    # PyYAML is imported at the top of every validate_*.py and a few skill
    # scripts. It used to be supplied via 'uv run --with pyyaml ...' invocation,
    # but that didn't reflect in the manifest — making pyright/IDE tooling
    # complain about an unresolved import. Declaring it here is the source of
    # truth and keeps the runtime contract honest.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# CI (ci.yml Test + release.yml) runs `uv sync --extra dev` then `uv run
# pytest/ruff/mypy`. Without this group `uv sync --extra dev` errors with
# "Extra `dev` is not defined" and breaks the Test + Release jobs on every push.
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/Emasoft/ai-maestro-integrator-agent"
Repository = "https://github.com/Emasoft/ai-maestro-integrator-agent"

[tool.ruff.lint.per-file-ignores]
# E402 (import not at top of file) is STRUCTURAL in tests/, not an oversight:
# every test file must `sys.path.insert` the scripts/ and tests/ dirs before it
# can import the modules under test, so the imports cannot precede that code.
#
# This replaces a per-import `# noqa: E402` on each line. Those worked until
# `ruff check --fix` reorganised the imports into parenthesized form and carried
# each noqa INSIDE the parens, where it no longer suppresses the statement —
# turning 9 auto-fixed I001s into 10 new E402s. A rule that is structural for a
# whole directory belongs in config, stated once, where a formatter cannot move
# it off the line it applies to.
"tests/*.py" = ["E402"]
